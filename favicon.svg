<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>

    <!-- Vibrant Sky to Cyan/Blue Gradient -->
    <linearGradient id="voiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Soundwave Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Plate with Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="484" height="484" x="14" y="14" rx="114" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>

  <!-- Outer Soundwaves (Equalizer Bars Left & Right) -->
  <!-- Left Soundwaves -->
  <rect x="76" y="216" width="16" height="80" rx="8" fill="url(#glowGrad)" opacity="0.6"/>
  <rect x="110" y="176" width="16" height="160" rx="8" fill="url(#glowGrad)" opacity="0.85"/>
  <rect x="144" y="136" width="16" height="240" rx="8" fill="url(#glowGrad)"/>

  <!-- Right Soundwaves -->
  <rect x="352" y="136" width="16" height="240" rx="8" fill="url(#glowGrad)"/>
  <rect x="386" y="176" width="16" height="160" rx="8" fill="url(#glowGrad)" opacity="0.85"/>
  <rect x="420" y="216" width="16" height="80" rx="8" fill="url(#glowGrad)" opacity="0.6"/>

  <!-- Central Studio Microphone -->
  <!-- Capsule Top -->
  <rect x="216" y="120" width="80" height="150" rx="40" fill="url(#voiceGrad)" filter="url(#neonGlow)"/>

  <!-- Microphone Mesh Inner Detailing -->
  <path d="M228 175 H284 M228 195 H284 M228 215 H284" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>

  <!-- Microphone U-Shaped Cradle / Stand -->
  <path d="M192 220 C192 295 320 295 320 220" fill="none" stroke="url(#voiceGrad)" stroke-width="18" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Stem & Base Stand -->
  <line x1="256" y1="290" x2="256" y2="360" stroke="url(#voiceGrad)" stroke-width="18" stroke-linecap="round"/>
  <rect x="206" y="360" width="100" height="20" rx="10" fill="url(#voiceGrad)"/>

  <!-- Sparkling AI Accent Star -->
  <path d="M370 90 Q370 120 340 120 Q370 120 370 150 Q370 120 400 120 Q370 120 370 90 Z" fill="#38bdf8" filter="url(#neonGlow)"/>
</svg>
